version: 1
feature: onboarding-to-first-digest
decisions: ../decisions.md
retired: []

actors:
  - id: subscriber
    name: Job-seeking subscriber
  - id: operator
    name: Product owner operating the dev deployment

observations:
  - id: O1
    statement: eve turns each defineSchedule into a Vercel Cron Job evaluated in UTC, fixed at build time, so a single authored cron cannot express per-subscriber local delivery times
    sources:
      - {ref: vercel/eve docs/schedules.mdx, revision: 7b8a520, locator: "On Vercel"}
  - id: O2
    statement: The eve sandbox receives no process.env, no secrets and no path back to the app runtime; built-in tools execute in the app runtime and proxy into the sandbox
    sources:
      - {ref: vercel/eve docs/concepts/security-model.md, revision: 7b8a520, locator: Trust boundaries}
  - id: O3
    statement: The agent-browser eve extension exposes browser__navigate, browser__snapshot, browser__click, browser__fill, browser__find and browser__screenshot, and accepts allowedDomains, contentBoundaries and maxOutputChars
    sources:
      - {ref: vercel/eve apps/docs/lib/integrations/data.ts, revision: 7b8a520, locator: agent-browser}
  - id: O4
    statement: Greenhouse, Lever and Ashby each expose an unauthenticated per-employer job board feed with no server-side search, so filtering is client-side. Endpoint shapes are from secondary sources and are not yet verified against primary documentation
    sources:
      - {ref: "https://github.com/Mersetti/ats-job-board-apis", revision: "2026-10-21", locator: README endpoints}
  - id: O5
    statement: eve's documented application-managed scheduling pattern claims due rows under an atomic lease and states that delivery is at least once, so side-effecting work needs application-level idempotency
    sources:
      - {ref: vercel/eve docs/patterns/dynamic-scheduling.md, revision: 7b8a520, locator: Delivery is at least once}
  - id: O6
    statement: Every eve session runs as one durable workflow checkpointed at step boundaries, surviving process restarts and redeploys
    sources:
      - {ref: vercel/eve docs/concepts/execution-model-and-durability.mdx, revision: 7b8a520, locator: Sessions, turns, and steps}

invariants:
  - id: I1
    rule: THE SYSTEM SHALL NOT present a job to a subscriber unless a recorded verification classified that opening verified_open
    decisions: [D7, D9, D48]
  - id: I2
    rule: THE SYSTEM SHALL NOT include an opening already delivered to that subscriber, matched at the exact-opening level
    decisions: [D17]
  - id: I3
    rule: THE SYSTEM SHALL NOT include a job that fails one of the subscriber's hard eligibility constraints
    decisions: [D13, D16, D42]
  - id: I4
    rule: THE SYSTEM SHALL NOT attribute to a subscriber any experience or qualification absent from their confirmed profile
    decisions: [D28, D43]
  - id: I5
    rule: THE SYSTEM SHALL NOT expose one subscriber's resume, profile or recommendations to another principal
    decisions: [D35]
  - id: I6
    rule: THE SYSTEM SHALL NOT send email to a subscriber without a current opt-in and no active pause or unsubscribe
    decisions: [D22, D46]
  - id: I7
    rule: THE SYSTEM SHALL NOT send more than one digest for the same send idempotency key
    decisions: [D22, D23]
  - id: I8
    rule: THE SYSTEM SHALL NOT act on instructions found in an external page or an uploaded document
    decisions: [D32]
  - id: I9
    rule: THE SYSTEM SHALL NOT perform a write action against an external site during research
    decisions: [D11, D12]

coverage:
  - {id: C1, actor: subscriber, goal: Sign in and reach the right onboarding stage, status: mapped, journeys: [J1]}
  - {id: C2, actor: subscriber, goal: Provide a resume or enter a profile manually, status: mapped, journeys: [J2]}
  - {id: C3, actor: subscriber, goal: Review and correct the extracted profile before it is used, status: mapped, journeys: [J3]}
  - {id: C4, actor: subscriber, goal: Answer preference questions and set digest size and delivery schedule, status: mapped, journeys: [J4]}
  - {id: C5, actor: subscriber, goal: Preview an initial ranked digest immediately, status: mapped, journeys: [J5]}
  - {id: C6, actor: operator, goal: Build and verify the shared job catalogue from a seed employer set, status: mapped, journeys: [J6]}
  - {id: C7, actor: subscriber, goal: Receive a test email digest, status: mapped, journeys: [J7]}
  - {id: C8, actor: subscriber, goal: Resume onboarding after closing the tab or losing a response, status: mapped, journeys: [J2, J3, J4]}
  - id: C9
    actor: subscriber
    goal: Receive digests automatically on a recurring schedule in their own timezone
    status: unresolved
    reason: Deferred to stage 3. Policy is now accepted under D50, D74, D75 and D76; the journey is not yet mapped
  - id: C10
    actor: subscriber
    goal: Pause, resume or unsubscribe from delivery
    status: unresolved
    reason: Accepted as policy under D46 but not mapped in the thin flow. J7.S1 reads the states; the subscriber-facing controls arrive in stage 3
  - id: C11
    actor: subscriber
    goal: Mark a job interested, not relevant, already applied or already contacted
    status: unresolved
    reason: Accepted as policy under D44 but deferred to stage 4. J5.S3 consumes these marks once they exist
  - id: C12
    actor: subscriber
    goal: See a relevant verified hiring contact for a recommendation
    status: unresolved
    reason: Deferred until verification and ranking are trustworthy under D73
  - id: C13
    actor: subscriber
    goal: Delete their account and stored data
    status: unresolved
    reason: Retention is accepted under D59; the deletion journey is not yet mapped
  - id: C14
    actor: operator
    goal: Expand employer coverage beyond the seed set
    status: unresolved
    reason: Continuous discovery is a stage 1 goal under D61 and D63, with automated admission under D64 and a separate budget under D66. J6 must be extended to map it before stage 1 is ready

journeys:
  - id: J1
    title: Sign in and reach onboarding
    actor: subscriber
    entry: J1.S1
    exits: [onboarding_ready, denied]
    steps:
      - id: J1.S1
        title: Authenticate with Clerk
        kind: system
        surface: web
        decisions: [D1, D35]
        invariants: [I5]
        criteria:
          c1: WHEN a visitor completes Clerk sign-in THE SYSTEM SHALL create or load the subscriber record keyed to the verified Clerk user id
          c2: IF a request carries no verified Clerk session THE SYSTEM SHALL NOT return any subscriber data
          c3: IF a request supplies a subscriber id that differs from the verified session principal THE SYSTEM SHALL NOT act on the supplied id
        next:
          - {to: J1.S2, when: authenticated}
          - {exit: denied, when: unauthenticated}
      - id: J1.S2
        title: Route to the first incomplete onboarding stage
        kind: system
        surface: web
        decisions: [D29, D30]
        invariants: []
        criteria:
          c1: WHEN a signed-in subscriber has no draft or confirmed profile THE SYSTEM SHALL route them to the resume stage
          c2: WHEN a signed-in subscriber has a draft profile that is not confirmed THE SYSTEM SHALL route them to the profile review stage
          c3: WHEN a signed-in subscriber has a confirmed profile and no saved preferences THE SYSTEM SHALL route them to the preferences stage
        exit: onboarding_ready
    review:
      input:
        status: covered
        reason: Sign-in input is handled by Clerk; the only application-side input is the session principal, which is read from the verified session
        refs: [J1.S1.c1, J1.S1.c3]
      permissions:
        status: covered
        reason: Unauthenticated requests return no subscriber data and a client-supplied id is never trusted
        refs: [J1.S1.c2, J1.S1.c3]
      interruption:
        status: covered
        reason: Onboarding stage is derived from persisted profile and preference state on every entry, so a closed tab resumes at the same stage
        refs: [J1.S2.c1, J1.S2.c2, J1.S2.c3]
      dependencies:
        status: open
        reason: Behaviour when Clerk itself is unavailable is unspecified. Recommend showing a retry page and emitting no partial subscriber record
      duplicates:
        status: covered
        reason: The subscriber record is keyed to the Clerk user id, so repeated sign-ins load rather than duplicate it
        refs: [J1.S1.c1]
      concurrency:
        status: covered
        reason: Two concurrent first sign-ins for one Clerk user id resolve to one record because the key is unique
        refs: [J1.S1.c1]
      recovery:
        status: covered
        reason: No durable side effect occurs before the subscriber record exists, and routing is recomputed from persisted state
        refs: [J1.S2.c1]

  - id: J2
    title: Provide a resume
    actor: subscriber
    entry: J2.S1
    exits: [draft_profile_ready, upload_rejected]
    steps:
      - id: J2.S1
        title: Submit a resume file or choose manual entry
        kind: human
        surface: web
        state: resume_stage
        decisions: [D47, D35]
        invariants: [I5]
        criteria:
          c1: WHEN a subscriber uploads a PDF or DOCX within the configured size limit THE SYSTEM SHALL store it in private object storage scoped to that subscriber
          c2: IF an upload fails type or size validation THE SYSTEM SHALL NOT store the file
          c3: WHEN an upload fails validation THE SYSTEM SHALL offer manual entry as a fallback
          c4: IF a principal requests a stored resume they do not own THE SYSTEM SHALL NOT return it
        next:
          - {to: J2.S2, when: file_accepted}
          - {to: J2.S3, when: manual_entry_chosen}
          - {exit: upload_rejected, when: validation_failed}
      - id: J2.S2
        title: Extract a draft profile from the document
        kind: system
        decisions: [D28, D32, D43]
        invariants: [I4, I8]
        criteria:
          c1: WHEN extraction runs THE SYSTEM SHALL record for each extracted item the document location it came from
          c2: WHEN extraction runs THE SYSTEM SHALL separate professional experience from personal projects, demos and work in progress
          c3: IF the document contains text that instructs the agent THE SYSTEM SHALL NOT act on that text
          c4: IF an extracted claim has no supporting location in the document THE SYSTEM SHALL NOT include it in the draft profile
          c5: WHEN extraction yields no usable professional experience THE SYSTEM SHALL offer manual entry
        next:
          - {to: J2.S3, when: extraction_unusable}
          - {exit: draft_profile_ready, when: extraction_usable}
      - id: J2.S3
        title: Enter a profile manually
        kind: human
        surface: web
        state: manual_entry
        decisions: [D28, D47]
        invariants: [I4]
        criteria:
          c1: WHEN a subscriber submits the manual form THE SYSTEM SHALL build the draft profile from exactly those entries
          c2: IF a field is left empty THE SYSTEM SHALL NOT populate it with an inferred value
          c3: WHEN a subscriber enters an item THE SYSTEM SHALL require them to classify it as professional experience or as a personal project
        exit: draft_profile_ready
    review:
      input:
        status: covered
        reason: Upload type and size are validated before storage, and manual entries are taken verbatim without inference
        refs: [J2.S1.c2, J2.S3.c2]
      permissions:
        status: covered
        reason: Stored resumes are scoped to their owner and reads by other principals are refused
        refs: [J2.S1.c1, J2.S1.c4]
      interruption:
        status: covered
        reason: The stored file and the draft profile are separate persisted artifacts, so an interrupted extraction leaves the upload intact and the subscriber can resubmit or switch to manual entry
        refs: [J2.S1.c1, J2.S2.c5]
      dependencies:
        status: open
        reason: Behaviour when object storage or the extraction model is unavailable is unspecified. Recommend keeping the subscriber at the resume stage with a retry and no partial draft profile
      duplicates:
        status: open
        reason: Behaviour when a subscriber uploads a second resume is unspecified. Recommend replacing the draft profile and retaining only the newest upload, consistent with the minimised retention recommended under Q11
      concurrency:
        status: open
        reason: Two concurrent uploads for one subscriber could race to write one draft profile. Recommend a single-writer claim per subscriber on the draft profile
      recovery:
        status: covered
        reason: Manual entry is always reachable as a fallback from both a rejected upload and an unusable extraction
        refs: [J2.S1.c3, J2.S2.c5]

  - id: J3
    title: Review and confirm the profile
    actor: subscriber
    entry: J3.S1
    exits: [profile_confirmed]
    steps:
      - id: J3.S1
        title: Present the draft profile with its provenance
        kind: system
        surface: web
        state: profile_review
        decisions: [D28, D29, D35]
        invariants: [I4, I5]
        criteria:
          c1: WHEN a draft profile is displayed THE SYSTEM SHALL mark each item as extracted from the document or manually entered
          c2: IF an item was not extracted from the document THE SYSTEM SHALL NOT label it as extracted
          c3: WHEN an item was extracted THE SYSTEM SHALL let the subscriber see the document location it came from
          c4: IF the requesting principal does not own the draft profile THE SYSTEM SHALL NOT display it
        next:
          - {to: J3.S2, when: displayed}
      - id: J3.S2
        title: Correct, add, remove or reclassify items
        kind: human
        surface: web
        state: profile_review
        decisions: [D28, D29]
        invariants: []
        criteria:
          c1: WHEN a subscriber edits an item THE SYSTEM SHALL persist that edit before advancing to the next stage
          c2: WHEN a subscriber moves an item between professional experience and personal projects THE SYSTEM SHALL store the new classification
          c3: WHEN a subscriber removes an item THE SYSTEM SHALL stop using it for matching
        next:
          - {to: J3.S3, when: submitted}
          - {to: J3.S2, when: further_edits}
      - id: J3.S3
        title: Confirm the profile
        kind: system
        decisions: [D29, D43]
        invariants: [I4]
        criteria:
          c1: WHEN a subscriber confirms THE SYSTEM SHALL record the confirmed profile with its confirmation timestamp
          c2: IF a profile has not been confirmed THE SYSTEM SHALL NOT use it to generate recommendations
          c3: WHEN a confirmed profile is later edited THE SYSTEM SHALL require confirmation again before the next digest
        exit: profile_confirmed
    review:
      input:
        status: covered
        reason: Edits are persisted as submitted and removals take effect on matching without inference
        refs: [J3.S2.c1, J3.S2.c3]
      permissions:
        status: covered
        reason: The draft profile is displayed only to the principal that owns it
        refs: [J3.S1.c4]
      interruption:
        status: covered
        reason: Each edit is persisted before the stage advances, and an unconfirmed profile cannot be used for recommendations
        refs: [J3.S2.c1, J3.S3.c2]
      dependencies:
        status: not-applicable
        reason: The step reads and writes only the application's own persisted profile rows and calls no external service
      duplicates:
        status: covered
        reason: Repeated confirmation records the same confirmed profile and its timestamp rather than creating a second profile
        refs: [J3.S3.c1]
      concurrency:
        status: open
        reason: Two sessions editing one draft profile could overwrite each other. Recommend last-write-wins on a per-item version with the losing writer told to reload
      recovery:
        status: covered
        reason: An unconfirmed profile cannot be used for recommendations, and a later edit re-requires confirmation
        refs: [J3.S3.c2, J3.S3.c3]

  - id: J4
    title: Set preferences and delivery schedule
    actor: subscriber
    entry: J4.S1
    exits: [preferences_saved]
    steps:
      - id: J4.S1
        title: Ask only the questions not already answered
        kind: system
        surface: web
        state: preferences
        decisions: [D30, D35, D53]
        invariants: [I5]
        criteria:
          c1: WHEN the question set is built THE SYSTEM SHALL omit questions already answered by the confirmed profile or a previous answer
          c2: WHEN a subscriber selects their target job families THE SYSTEM SHALL present only the question branches belonging to those families
          c3: IF the subscriber selects no job family THE SYSTEM SHALL NOT advance to the next stage
          c4: IF the requesting principal does not own the preferences THE SYSTEM SHALL NOT return or modify them
        next:
          - {to: J4.S2, when: answered}
      - id: J4.S2
        title: Record hard constraints separately from preferences
        kind: system
        decisions: [D13, D16, D42]
        invariants: [I3]
        criteria:
          c1: WHEN work authorisation, sponsorship requirement, country eligibility and exclusions are answered THE SYSTEM SHALL store them as hard constraints
          c2: WHEN target roles, seniority, industries, company stages and compensation expectations are answered THE SYSTEM SHALL store them as ranking preferences
          c3: IF a hard constraint answer is unknown THE SYSTEM SHALL NOT store it as satisfied
          c4: WHEN a remote preference is recorded THE SYSTEM SHALL keep any geographic restriction as a hard constraint rather than a preference
        next:
          - {to: J4.S3, when: stored}
      - id: J4.S3
        title: Set digest size, delivery time and timezone
        kind: human
        surface: web
        state: preferences
        decisions: [D15, D19, D69, D76]
        invariants: []
        criteria:
          c1: WHEN no digest size is chosen THE SYSTEM SHALL default it to 10
          c2: WHEN a delivery time is chosen THE SYSTEM SHALL store the local time of day and a separate IANA timezone identifier
          c3: IF a submitted timezone is not a recognised IANA identifier THE SYSTEM SHALL NOT save the schedule
          c4: IF a submitted digest size falls outside 3 to 20 THE SYSTEM SHALL NOT save the schedule
          c5: WHEN delivery days are chosen THE SYSTEM SHALL store them as a set of weekdays evaluated in the subscriber's timezone
          c6: IF no delivery day is selected THE SYSTEM SHALL NOT save the schedule
        next:
          - {to: J4.S4, when: submitted}
      - id: J4.S4
        title: Save preferences and record delivery opt-in
        kind: system
        decisions: [D22, D46]
        invariants: [I6]
        criteria:
          c1: WHEN preferences are saved THE SYSTEM SHALL record an explicit delivery opt-in with its timestamp
          c2: IF a subscriber has not given an explicit opt-in THE SYSTEM SHALL NOT mark them eligible for delivery
          c3: WHEN preferences are saved THE SYSTEM SHALL make them editable without repeating onboarding
        exit: preferences_saved
    review:
      input:
        status: covered
        reason: Timezone, digest size and job-family selection are validated and rejected rather than coerced
        refs: [J4.S1.c3, J4.S3.c3, J4.S3.c4]
      permissions:
        status: covered
        reason: Preferences are returned and modified only for the principal that owns them
        refs: [J4.S1.c4]
      interruption:
        status: covered
        reason: Preferences are saved as one record and the opt-in is written with it, so an interrupted run leaves the subscriber ineligible for delivery rather than half-subscribed
        refs: [J4.S4.c1, J4.S4.c2]
      dependencies:
        status: not-applicable
        reason: The step reads and writes only the application's own persisted preference rows and calls no external service
      duplicates:
        status: covered
        reason: Saving preferences again updates the one preference record and its opt-in timestamp rather than creating a second subscription
        refs: [J4.S4.c1, J4.S4.c3]
      concurrency:
        status: open
        reason: Two sessions saving preferences could interleave a schedule change with an opt-in change. Recommend a single preference row updated transactionally
      recovery:
        status: covered
        reason: Delivery eligibility requires an explicit opt-in, so an incomplete run leaves nothing scheduled, and preferences stay editable afterwards
        refs: [J4.S4.c2, J4.S4.c3]

  - id: J5
    title: Generate a ranked preview digest
    actor: subscriber
    entry: J5.S1
    exits: [preview_shown, preview_empty]
    steps:
      - id: J5.S1
        title: Select candidates from the shared catalogue
        kind: system
        decisions: [D4, D37]
        invariants: [I5]
        criteria:
          c1: WHEN a preview is requested THE SYSTEM SHALL read candidate openings from the shared catalogue rather than researching per subscriber
          c2: IF a row holds another subscriber's private profile or recommendation data THE SYSTEM SHALL NOT read it into this preview
          c3: WHEN the catalogue holds no openings for the subscriber's job families THE SYSTEM SHALL record that as the shortfall reason
        next:
          - {to: J5.S2, when: candidates_found}
          - {exit: preview_empty, when: catalogue_empty}
      - id: J5.S2
        title: Apply hard eligibility constraints before ranking
        kind: system
        decisions: [D13, D16, D42]
        invariants: [I3]
        criteria:
          c1: WHEN filtering runs THE SYSTEM SHALL remove every opening that fails a hard constraint before any ranking occurs
          c2: IF an opening's sponsorship, salary or country eligibility is unknown THE SYSTEM SHALL NOT treat the affected constraint as satisfied
          c3: WHEN an opening is marked remote THE SYSTEM SHALL apply its stated geographic restriction rather than treating remote as worldwide
        next:
          - {to: J5.S3, when: survivors_remain}
          - {exit: preview_empty, when: none_eligible}
      - id: J5.S3
        title: Remove already-seen and equivalent openings
        kind: system
        decisions: [D17, D18]
        invariants: [I2]
        criteria:
          c1: WHEN exclusion runs THE SYSTEM SHALL remove openings already delivered to this subscriber, matched at the exact-opening level
          c2: WHEN two listings describe one opening found through different sources THE SYSTEM SHALL collapse them into a single candidate
          c3: IF the subscriber recorded an application against a different opening at the same employer THE SYSTEM SHALL NOT exclude this opening
          c4: WHEN an opening is a different requisition or a reopened role THE SYSTEM SHALL label it as such rather than suppressing it
        next:
          - {to: J5.S4, when: survivors_remain}
          - {exit: preview_empty, when: all_already_seen}
      - id: J5.S4
        title: Require current verified availability
        kind: system
        decisions: [D7, D9, D48]
        invariants: [I1]
        criteria:
          c1: WHEN a candidate's last verification is older than the configured freshness window THE SYSTEM SHALL revalidate it before including it
          c2: IF a candidate is not classified verified_open THE SYSTEM SHALL NOT include it in the preview
          c3: WHEN revalidation is inconclusive THE SYSTEM SHALL classify the candidate uncertain and record the observed failure
          c4: WHEN a verification result is produced THE SYSTEM SHALL cache it against the opening so other subscribers reuse it
        next:
          - {to: J5.S5, when: survivors_remain}
          - {exit: preview_empty, when: none_verified_open}
      - id: J5.S5
        title: Rank the survivors and explain each fit
        kind: system
        decisions: [D40, D41, D43]
        invariants: [I4]
        criteria:
          c1: WHEN assessing relevance THE SYSTEM SHALL read the opening's responsibilities, stack, seniority and domain rather than inferring them from its title
          c2: WHEN an explanation is produced THE SYSTEM SHALL ground every candidate-side claim in the confirmed profile
          c3: IF a fit claim is not supported by the confirmed profile THE SYSTEM SHALL NOT include that claim in the explanation
          c4: WHEN material gaps or constraints exist THE SYSTEM SHALL state them alongside the fit explanation
          c5: WHEN model output fails structured validation THE SYSTEM SHALL drop that candidate rather than presenting unvalidated text
        next:
          - {to: J5.S6, when: ranked}
      - id: J5.S6
        title: Return up to N matches and explain any shortfall
        kind: system
        surface: web
        decisions: [D14, D38, D49]
        invariants: [I1, I2, I3]
        criteria:
          c1: WHEN fewer than the requested number of matches survive THE SYSTEM SHALL return only the survivors and state why the count is short
          c2: IF fewer than the requested number survive THE SYSTEM SHALL NOT add an opening that failed availability, eligibility or exclusion in order to reach the requested count
          c3: WHEN any displayed opening derives from mock data THE SYSTEM SHALL label it as mock rather than verified
          c4: WHEN a verified opening is displayed THE SYSTEM SHALL NOT present it as a guarantee of interview or hire
        next:
          - {exit: preview_shown, when: at_least_one_match}
          - {exit: preview_empty, when: no_matches}
    review:
      input:
        status: covered
        reason: Candidates come from the shared catalogue rather than from request input, and model output that fails structured validation is dropped instead of displayed
        refs: [J5.S1.c1, J5.S5.c5]
      permissions:
        status: covered
        reason: Private rows belonging to other subscribers are never read into a preview, while public catalogue rows are shared by design
        refs: [J5.S1.c1, J5.S1.c2]
      interruption:
        status: open
        reason: Whether a preview interrupted midway is resumed or recomputed is unspecified. Recommend recomputing, since a preview writes no delivery history until J7.S4
      dependencies:
        status: covered
        reason: An inconclusive revalidation yields the uncertain state and excludes the candidate instead of failing the preview or assuming closure
        refs: [J5.S4.c2, J5.S4.c3]
      duplicates:
        status: covered
        reason: Equivalent listings of one opening collapse to a single candidate and already-delivered openings are excluded at the exact-opening level
        refs: [J5.S3.c1, J5.S3.c2]
      concurrency:
        status: open
        reason: Two concurrent previews for one subscriber could both verify the same openings. Recommend a per-opening verification lease so the shared cache is written once
      recovery:
        status: covered
        reason: Every exhausted filter path reaches preview_empty with a recorded shortfall reason rather than an empty screen or a padded list
        refs: [J5.S1.c3, J5.S6.c1, J5.S6.c2]

  - id: J6
    title: Build the verified job catalogue
    actor: operator
    entry: J6.S1
    exits: [catalogue_updated]
    steps:
      - id: J6.S1
        title: Resolve seed employers into the registry
        kind: system
        decisions: [D5, D55]
        invariants: []
        criteria:
          c1: WHEN an employer is admitted THE SYSTEM SHALL record its verified identity, website, careers page and ATS board
          c2: IF two companies share a name THE SYSTEM SHALL NOT merge them into one registry entry
          c3: IF an addition would take the registry past the configured employer cap THE SYSTEM SHALL NOT admit it
          c4: WHEN an employer's ATS board cannot be confirmed from its own careers page THE SYSTEM SHALL leave the employer pending rather than admitted
        next:
          - {to: J6.S2, when: employer_admitted}
      - id: J6.S2
        title: Fetch the employer's structured ATS feed
        kind: external
        decisions: [D6, D7, D36]
        observations: [O4]
        invariants: []
        criteria:
          c1: WHEN an employer has a Greenhouse, Lever or Ashby board THE SYSTEM SHALL fetch that employer's own public feed rather than an aggregator
          c2: IF a feed request fails or returns no listings THE SYSTEM SHALL NOT mark that employer's existing openings closed
          c3: WHEN a feed responds THE SYSTEM SHALL record the canonical URL, source URL, requisition id and relevant description for each listing
          c4: IF a listing is known only from a directory or aggregator THE SYSTEM SHALL NOT classify it verified_open
          c5: WHEN the configured request budget for a run is exhausted THE SYSTEM SHALL stop fetching and record the run as partial
        next:
          - {to: J6.S3, when: feed_usable}
          - {to: J6.S4, when: feed_missing_or_incomplete}
      - id: J6.S3
        title: Record dates and availability from the feed
        kind: system
        decisions: [D9, D10]
        invariants: [I1]
        criteria:
          c1: WHEN a listing is recorded THE SYSTEM SHALL keep its original publication date, update date, first-seen date and last-verification time as four distinct fields
          c2: IF a listing's update date changes while its requisition id does not THE SYSTEM SHALL NOT record it as a new vacancy
          c3: IF availability cannot be established from the feed THE SYSTEM SHALL NOT classify the listing verified_open
          c4: WHEN a previously listed opening is absent from a successful full feed response THE SYSTEM SHALL classify it confirmed_closed
        exit: catalogue_updated
      - id: J6.S4
        title: Verify selectively with the sandbox browser
        kind: system
        decisions: [D3, D8, D11, D12, D33, D34, D36]
        observations: [O2, O3]
        invariants: [I1, I8, I9]
        criteria:
          c1: WHEN simpler retrieval returns incomplete content or a JavaScript shell THE SYSTEM SHALL inspect the official board in the sandbox browser
          c2: WHEN the browser inspects a board or listing THE SYSTEM SHALL record which URLs were actually loaded and what was observed
          c3: WHEN an Apply link is followed THE SYSTEM SHALL record whether an application form, a login requirement or a closure notice was present
          c4: IF only an Apply button is observed THE SYSTEM SHALL NOT classify the listing verified_open
          c5: IF a fetched page contains text that instructs the agent THE SYSTEM SHALL NOT act on it
          c6: IF an action would submit a form, upload a file, create an account or contact an employer THE SYSTEM SHALL NOT perform it
          c7: IF the browser receives a timeout, a 403, a CAPTCHA, a blank page or a single 404 THE SYSTEM SHALL NOT classify the listing confirmed_closed
          c8: IF a destination is outside the configured domain allow list or resolves to a private address THE SYSTEM SHALL NOT navigate to it
          c9: WHEN the configured page, runtime or browser-session budget is reached THE SYSTEM SHALL stop and record the outcome as uncertain
          c10: WHEN an ATS migration or changed URL is detected THE SYSTEM SHALL record the new location against the same opening
        exit: catalogue_updated
    review:
      input:
        status: covered
        reason: Feed and page content is treated as untrusted data, never as instruction, and only an owner-seeded employer with a confirmed board is admitted
        refs: [J6.S1.c4, J6.S4.c5]
      permissions:
        status: covered
        reason: Research is read-only, destinations are allow-listed, private addresses are refused, and no external write action is permitted
        refs: [J6.S4.c6, J6.S4.c8]
      interruption:
        status: covered
        reason: An exhausted budget records the run as partial or the outcome as uncertain instead of leaving openings implicitly closed
        refs: [J6.S2.c5, J6.S4.c9]
      dependencies:
        status: covered
        reason: Feed failures, blocks and ambiguous pages never produce a closure, and migrations are recorded against the same opening
        refs: [J6.S2.c2, J6.S4.c7, J6.S4.c10]
      duplicates:
        status: covered
        reason: A refreshed update date on an unchanged requisition id does not create a second vacancy
        refs: [J6.S3.c2]
      concurrency:
        status: open
        reason: Concurrent catalogue runs could verify one opening twice and waste the browser budget. Recommend a per-opening verification lease shared with J5.S4
      recovery:
        status: open
        reason: Whether a partial run resumes at the unfetched employers or restarts is unspecified. Recommend resuming from a per-employer cursor so the budget is not re-spent

  - id: J7
    title: Send a test email digest
    actor: subscriber
    entry: J7.S1
    exits: [sent, suppressed]
    steps:
      - id: J7.S1
        title: Check delivery eligibility
        kind: system
        decisions: [D22, D46]
        invariants: [I5, I6]
        criteria:
          c1: WHEN a send is requested THE SYSTEM SHALL check the current opt-in, pause and unsubscribe state before preparing the message
          c2: IF the subscriber is not opted in, is paused or has unsubscribed THE SYSTEM SHALL NOT send
          c3: IF the recipient address does not match the verified address of the authenticated subscriber THE SYSTEM SHALL NOT send
        next:
          - {to: J7.S2, when: eligible}
          - {exit: suppressed, when: ineligible}
      - id: J7.S2
        title: Claim the send with an idempotency key
        kind: system
        decisions: [D22, D23]
        observations: [O5]
        invariants: [I7]
        criteria:
          c1: WHEN a digest is prepared THE SYSTEM SHALL derive an idempotency key from the subscriber and the digest identity and persist a send record before calling the provider
          c2: IF a send record for that key already exists in a sent or in-flight state THE SYSTEM SHALL NOT call the provider again
          c3: WHEN a send record is claimed THE SYSTEM SHALL store the exact openings the digest will contain
        next:
          - {to: J7.S3, when: claimed}
          - {exit: suppressed, when: already_claimed}
      - id: J7.S3
        title: Render and send the digest
        kind: system
        decisions: [D24, D38, D40, D49, D52]
        invariants: []
        criteria:
          c1: WHEN the digest renders THE SYSTEM SHALL include for each opening the company, the role, the direct application URL, the fit explanation, the material gaps and constraints, the published compensation or undisclosed, the location and remote restrictions, the sponsorship evidence or its uncertainty, the supporting sources and the last-verification date
          c2: WHEN the digest renders THE SYSTEM SHALL read persisted recommendation rows rather than calling a model at send time
          c3: WHEN the digest contains mock data THE SYSTEM SHALL label it as mock
          c4: IF a recipient clicks an application link THE SYSTEM SHALL NOT record an application as submitted
        next:
          - {to: J7.S4, when: provider_called}
      - id: J7.S4
        title: Reconcile the send result
        kind: system
        decisions: [D22, D23]
        observations: [O5]
        invariants: [I7]
        criteria:
          c1: WHEN the provider confirms acceptance THE SYSTEM SHALL mark the send record sent and store the provider message id
          c2: WHEN the provider result is unknown THE SYSTEM SHALL mark the send record uncertain
          c3: IF a send record is uncertain THE SYSTEM SHALL NOT retry it before reconciling against the provider
          c4: WHEN a digest is recorded sent THE SYSTEM SHALL add each included opening to the subscriber's delivery history
        exit: sent
    review:
      input:
        status: covered
        reason: The recipient is taken from the verified subscriber record rather than from the request, and the digest body is rendered from persisted rows
        refs: [J7.S1.c3, J7.S3.c2]
      permissions:
        status: covered
        reason: Opt-in, pause and unsubscribe state is checked before the message is prepared, and a mismatched recipient is refused
        refs: [J7.S1.c2, J7.S1.c3]
      interruption:
        status: covered
        reason: The send record is persisted before the provider call, so a crash between the two leaves an in-flight record that reconciliation resolves rather than a silent double send
        refs: [J7.S2.c1, J7.S4.c2, J7.S4.c3]
      dependencies:
        status: covered
        reason: An unknown provider result becomes the uncertain state and blocks retry until reconciliation
        refs: [J7.S4.c2, J7.S4.c3]
      duplicates:
        status: covered
        reason: A second send for an existing key never reaches the provider, which is what makes the at-least-once dispatch of O5 safe
        refs: [J7.S2.c2]
      concurrency:
        status: covered
        reason: The idempotency key is persisted as the claim, so two concurrent sends resolve to one provider call and the loser exits suppressed
        refs: [J7.S2.c1, J7.S2.c2]
      recovery:
        status: open
        reason: Whether an uncertain send is eventually retried, abandoned or escalated after reconciliation is unspecified and depends on the missed-run policy open under Q7
